name: pcport

services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # DNS-01 so the origin can sit behind Cloudflare without opening :80 to it.
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --accesslog=true
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks: [edge]

  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pcport:${POSTGRES_PASSWORD}@db:5432/pcport
      REVALIDATE_TOKEN: ${REVALIDATE_TOKEN}
    volumes:
      # ISR cache survives restarts; without this every page regenerates cold.
      - next-cache:/app/.next/cache
    depends_on:
      db:
        condition: service_healthy
    networks: [edge, internal]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: pcport_edge
      traefik.http.routers.pcport.rule: Host(`pcport.org`) || Host(`www.pcport.org`)
      traefik.http.routers.pcport.entrypoints: websecure
      traefik.http.routers.pcport.tls.certresolver: le
      traefik.http.services.pcport.loadbalancer.server.port: '3000'
      traefik.http.routers.pcport.middlewares: pcport-chain@docker

      # www → apex, so one canonical host accumulates the authority.
      traefik.http.middlewares.pcport-www.redirectregex.regex: ^https://www\.pcport\.org/(.*)
      traefik.http.middlewares.pcport-www.redirectregex.replacement: https://pcport.org/$${1}
      traefik.http.middlewares.pcport-www.redirectregex.permanent: 'true'

      traefik.http.middlewares.pcport-zip.compress: 'true'

      traefik.http.middlewares.pcport-sec.headers.stsSeconds: '31536000'
      traefik.http.middlewares.pcport-sec.headers.stsIncludeSubdomains: 'true'
      traefik.http.middlewares.pcport-sec.headers.contentTypeNosniff: 'true'
      traefik.http.middlewares.pcport-sec.headers.frameDeny: 'true'
      traefik.http.middlewares.pcport-sec.headers.referrerPolicy: strict-origin-when-cross-origin
      traefik.http.middlewares.pcport-sec.headers.customResponseHeaders.X-Powered-By: ''

      traefik.http.middlewares.pcport-chain.chain.middlewares: pcport-www,pcport-zip,pcport-sec

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pcport
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pcport
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pcport -d pcport']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

volumes:
  pgdata:
  letsencrypt:
  next-cache:

networks:
  edge:
  internal:
    internal: true
