name: pcport

# This host runs a shared Traefik v3.5 that already owns :80 and :443 for a
# dozen other sites, so this project brings no proxy and publishes no ports.
# It joins the proxy's network and is reached by container name; routing lives
# in /opt/traefik/dynamic/pcport.yml, which is the convention here.
#
# No database: the catalog is JSON in the repository, so the data layer reads
# it directly. Postgres gets added the day content stops fitting in git.

services:
  web:
    build: .
    image: pcport-app
    container_name: pcport-app
    restart: unless-stopped

    environment:
      NODE_ENV: production
      # Lets the ingestion workflow regenerate only the pages that changed.
      REVALIDATE_TOKEN: ${REVALIDATE_TOKEN:?set REVALIDATE_TOKEN in .env}
      # Optional. With it, each contribution also opens an issue on GitHub; without
      # it, contributions are still stored and listed by deploy/submissions.sh.
      # A fine-grained token limited to this one repository, Issues: read and write.
      GITHUB_ISSUES_TOKEN: ${GITHUB_ISSUES_TOKEN:-}

    volumes:
      # The ISR cache lives on disk. Without this, every container restart
      # regenerates every page cold.
      - next-cache:/app/.next/cache
      # The catalog, so ingestion can update content without a rebuild. Seeded
      # from the image on first creation.
      - catalog-data:/app/data
      # Contributions. Private: names and emails live here and nowhere else.
      - submissions:/app/submissions

    networks:
      - traefik-proxy

    # Eleven of fifteen gigabytes are already in use on this box; an unbounded
    # container here is everyone else's outage.
    deploy:
      resources:
        limits:
          memory: 768M

    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

volumes:
  next-cache:
  catalog-data:
  submissions:

networks:
  traefik-proxy:
    external: true
